<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>מחוזות בחירה אזוריים — ישראל 2022</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body{margin:0;font-family:-apple-system,Segoe UI,Arial,sans-serif;color:#1a1a1a}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .panel{position:absolute;top:12px;right:12px;z-index:1000;background:#fff;border-radius:10px;
    box-shadow:0 1px 6px rgba(0,0,0,.2);padding:12px 14px;max-width:270px}
  .panel h1{font-size:15px;margin:0 0 4px}
  .panel p{font-size:12px;color:#555;margin:0 0 10px;line-height:1.5}
  .seg{display:flex;border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:8px}
  .seg button{flex:1;border:0;background:#fff;padding:7px 6px;font-size:13px;cursor:pointer}
  .seg button.on{background:#1f6fb2;color:#fff}
  .lbl{font-size:11px;color:#888;margin:6px 0 3px}
  #legend{font-size:12px;line-height:1.7;margin-top:6px}
  #legend span.sw,.leaflet-tooltip .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px;vertical-align:-1px}
  .leaflet-tooltip.dt{direction:rtl;text-align:right;font-size:12px;line-height:1.6;padding:8px 10px;max-width:340px;white-space:normal}
  .foot{font-size:10px;color:#999;margin-top:8px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>מחוזות בחירה אזוריים</h1>
  <p>סימולציה על תוצאות בחירות 2022 לפי קלפי. מחוזות שווי-אוכלוסייה, שיטת "המנצח לוקח הכול".</p>
  <div class="lbl">מספר מחוזות</div>
  <div class="seg" id="nseg"><button data-n="n120" class="on">120</button><button data-n="n215">215</button></div>
  <div class="lbl">צביעה</div>
  <div class="seg" id="cseg"><button data-c="bloc" class="on">גושים</button><button data-c="party">מפלגה זוכה</button></div>
  <div id="legend"></div>
  <div class="foot">ריחוף על מחוז לפירוט · שטח ≠ קולות</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PARTYNAMES={'מחל':'הליכוד','פה':'יש עתיד','ט':'הציונות הדתית','כן':'המחנה הממלכתי','שס':'ש"ס','ג':'יהדות התורה','ל':'ישראל ביתנו','עם':'רע"מ','ום':'חד"ש-תע"ל','אמת':'העבודה','מרצ':'מרצ','ד':'בל"ד'};
const PCOL={'מחל':'#1f6fb2','פה':'#5bc8e8','ט':'#2b1a4a','שס':'#111111','ג':'#8a6d3b','כן':'#8e44ad','ל':'#d4a017','עם':'#1e8449','ום':'#c0392b','אמת':'#e74c3c','מרצ':'#27ae60','ד':'#16a085'};
const BLOCS=['ימין','מרכז-שמאל','חרדי','ערבי'];
const BLOCCOL={'ימין':'#1f6fb2','מרכז-שמאל':'#eb6834','חרדי':'#111111','ערבי':'#1e8449'};
let curN='n120',curC='bloc',layer=null,DATA=null;
const map=L.map('map').setView([31.3,34.9],7.4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap, &copy; CARTO',subdomains:'abcd',maxZoom:16}).addTo(map);
function colorOf(p){return curC==='bloc'?BLOCCOL[p.wb]:(PCOL[p.wp]||'#999');}
function tip(p){
  const b=p.b||[0,0,0,0];
  const rows=BLOCS.map((k,i)=>[k,b[i]||0]).sort((x,y)=>y[1]-x[1])
    .map(([k,v])=>`<div><span class="sw" style="background:${BLOCCOL[k]}"></span>${k}: ${v}%</div>`).join('');
  const s=p.s||[],sn=p.sn||s.length,more=sn>s.length?` ועוד ${sn-s.length}`:'';
  const setl=s.length?`<div style="margin-top:6px;border-top:1px solid #eee;padding-top:4px;color:#444"><b>יישובים (${sn}):</b> ${s.join(', ')}${more}</div>`:'';
  return `<b>מחוז ${p.d}</b> · ${(p.v||0).toLocaleString()} מצביעים<br>זוכה: <b>${PARTYNAMES[p.wp]||p.wp}</b> (גוש ${p.wb}) · מרווח ${p.m}%<hr style="margin:5px 0;border:0;border-top:1px solid #eee">${rows}${setl}`;
}
function legend(){
  const f=DATA[curN].features,cnt={},colf={};
  f.forEach(x=>{const k=curC==='bloc'?x.properties.wb:x.properties.wp;cnt[k]=(cnt[k]||0)+1;colf[k]=colorOf(x.properties);});
  const nm=k=>curC==='bloc'?k:(PARTYNAMES[k]||k);
  document.getElementById('legend').innerHTML=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])
    .map(k=>`<div><span class="sw" style="background:${colf[k]}"></span>${nm(k)} <b>(${cnt[k]})</b></div>`).join('');
}
function draw(){
  if(layer)map.removeLayer(layer);
  layer=L.geoJSON(DATA[curN],{style:f=>({color:'#fff',weight:0.6,fillColor:colorOf(f.properties),fillOpacity:0.82}),
    onEachFeature:(f,l)=>{try{l.bindTooltip(tip(f.properties),{className:'dt',sticky:true});}catch(e){}
      l.on('mouseover',()=>l.setStyle({weight:2,color:'#000'}));l.on('mouseout',()=>l.setStyle({weight:0.6,color:'#fff'}));}}).addTo(map);
  legend();
}
document.getElementById('nseg').onclick=e=>{if(!e.target.dataset.n)return;document.querySelectorAll('#nseg button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');curN=e.target.dataset.n;draw();};
document.getElementById('cseg').onclick=e=>{if(!e.target.dataset.c)return;document.querySelectorAll('#cseg button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');curC=e.target.dataset.c;draw();};
fetch('mapdata.json').then(r=>r.json()).then(d=>{DATA=d;if(d.outline)L.geoJSON(d.outline,{style:{color:'#333',weight:1.3,fill:false}}).addTo(map);draw();})
  .catch(e=>{document.getElementById('legend').innerHTML='<span style="color:#c00">שגיאה בטעינת mapdata.json</span>';});
</script>
</body>
</html>
